spring:
  application:
    name: hwmvp
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:managehw}
        format_sql: true
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:managehw}
    default-schema: ${DB_SCHEMA:managehw}
    create-schemas: false
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

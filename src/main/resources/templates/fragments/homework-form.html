<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="screen form-screen hidden" id="formScreen" aria-labelledby="formTitle" th:fragment="homework-form-screen">
  <header class="form-header">
    <button class="icon-button back-button" id="backButton" type="button" aria-label="숙제 목록으로 돌아가기">‹</button>
    <div><h1 id="formTitle">숙제 등록</h1><p>새로운 숙제를 추가해 보세요.</p></div>
  </header>
  <form class="homework-form" id="homeworkForm" novalidate>
    <div class="form-context">
      <div class="target-student"><span>대상 학생</span><strong id="targetStudent"></strong></div>
      <div class="assigned-date-field">
        <label for="assignedDateInput">숙제 선택일 <span aria-hidden="true">*</span></label>
        <input id="assignedDateInput" name="assignedDate" type="date" aria-describedby="assignedDateError">
        <small class="field-error" id="assignedDateError"></small>
      </div>
    </div>
    <fieldset>
      <legend>과목 <span aria-hidden="true">*</span></legend>
      <div class="subject-options" id="subjectOptions"></div>
      <small class="field-error" id="subjectError"></small>
    </fieldset>
    <div class="form-field">
      <label for="titleInput">제목 <span aria-hidden="true">*</span></label>
      <input id="titleInput" name="title" type="text" maxlength="200" placeholder="예) 수학 익힘책 54~57쪽 풀기" aria-describedby="titleError">
      <small class="field-error" id="titleError"></small>
    </div>
    <fieldset class="task-fieldset">
      <div class="label-row"><legend>할 일 <span aria-hidden="true">*</span></legend><small>최대 50개</small></div>
      <p class="task-help">완료 여부를 따로 확인할 수 있도록 할 일을 한 줄씩 입력해 주세요.</p>
      <div class="task-input-list" id="taskInputList"></div>
      <button class="secondary-button add-task-button" id="addTaskButton" type="button">＋ 할 일 추가</button>
      <small class="field-error" id="tasksError"></small>
    </fieldset>
    <div class="form-field">
      <label for="dueDateInput">마감일 <span aria-hidden="true">*</span></label>
      <input id="dueDateInput" name="dueDate" type="date" aria-describedby="dueDateError">
      <small class="field-error" id="dueDateError"></small>
    </div>
    <p class="form-note">숙제 선택일은 달력에 표시될 날짜이고, 마감일은 숙제를 끝내야 하는 날짜예요.</p>
    <p class="form-note">진행률은 완료한 할 일 수를 기준으로 자동 계산돼요.</p>
    <div class="form-error hidden" id="formError" role="alert"></div>
    <div class="form-actions">
      <button class="secondary-button" id="cancelButton" type="button">취소</button>
      <button class="primary-button" id="saveButton" type="submit">숙제 저장</button>
    </div>
  </form>
</section>
</body>
</html>

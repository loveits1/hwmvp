<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="날짜별 숙제와 학습 진행 상태를 관리하는 대시보드" />
  <title>오늘의 숙제</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="날짜 탐색">
      <a class="brand" href="#" aria-label="홈으로">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>하루숙제</span>
      </a>

      <div class="view-control">
        <label for="viewMode">보기 방식</label>
        <div class="select-wrap">
          <select id="viewMode">
            <option value="week">주 단위</option>
            <option value="month">월 단위</option>
          </select>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m7 10 5 5 5-5" />
          </svg>
        </div>
      </div>

      <div class="date-heading">
        <div>
          <p class="eyebrow">2026년</p>
          <h2 id="periodTitle">8월 4주</h2>
        </div>
        <div class="arrow-group">
          <button class="icon-button" type="button" id="prevPeriod" aria-label="이전 기간">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button class="icon-button" type="button" id="nextPeriod" aria-label="다음 기간">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </div>

      <nav class="date-list" id="dateList" aria-label="날짜 목록"></nav>

      <div class="sidebar-bottom">
        <button class="today-button" type="button" id="todayButton">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="16" rx="3" />
            <path d="M16 3v4M8 3v4M3 10h18" />
          </svg>
          오늘로 이동
        </button>
        <p>차근차근 해내는 중이에요 <span aria-hidden="true">🌱</span></p>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" type="button" aria-label="날짜 메뉴 열기" id="menuButton">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <div class="topbar-copy">
          <p class="eyebrow">HOMEWORK DASHBOARD</p>
          <h1>오늘도 하나씩 해볼까요?</h1>
        </div>
        <div class="profile">
          <div class="profile-copy">
            <strong>김하늘</strong>
            <span>초록초등학교 5학년</span>
          </div>
          <div class="avatar" aria-hidden="true">하</div>
          <button class="icon-button" type="button" aria-label="알림 보기">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
            </svg>
            <span class="notification-dot"></span>
          </button>
        </div>
      </header>

      <section class="dashboard" aria-labelledby="selectedDateTitle">
        <div class="welcome-card">
          <div class="welcome-copy">
            <div class="date-badge"><span id="badgeMonth">AUG</span><strong id="badgeDay">19</strong></div>
            <div>
              <p class="eyebrow">오늘의 학습</p>
              <h2 id="selectedDateTitle">8월 19일 수요일</h2>
              <p><strong>5개</strong>의 숙제가 있어요. 벌써 <strong>2개</strong>를 끝냈어요!</p>
            </div>
          </div>
          <div class="streak">
            <span class="streak-icon" aria-hidden="true">🔥</span>
            <div><strong>7일 연속</strong><span>멋진 기록이에요!</span></div>
          </div>
        </div>

        <div class="summary-grid" aria-label="숙제 상태 요약">
          <button class="summary-card active" type="button" data-filter="all">
            <span class="summary-icon all"><svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
              </svg></span>
            <span><small>전체 숙제</small><strong>5</strong></span>
          </button>
          <button class="summary-card" type="button" data-filter="done">
            <span class="summary-icon done"><svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m6 12 4 4 8-8" />
              </svg></span>
            <span><small>완료</small><strong>2</strong></span>
          </button>
          <button class="summary-card" type="button" data-filter="doing">
            <span class="summary-icon doing"><svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 6v6l4 2" />
                <circle cx="12" cy="12" r="9" />
              </svg></span>
            <span><small>진행 중</small><strong>2</strong></span>
          </button>
          <button class="summary-card" type="button" data-filter="todo">
            <span class="summary-icon todo"><svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v5M12 16h.01" />
              </svg></span>
            <span><small>미완료</small><strong>1</strong></span>
          </button>
        </div>

        <div class="content-heading">
          <div>
            <h2>숙제 목록</h2>
            <p>카드를 눌러 진행률을 바꿔보세요.</p>
          </div>
          <div class="heading-actions">
            <button class="filter-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 6h16M7 12h10M10 18h4" />
              </svg> 필터
            </button>
            <button class="add-button" type="button" id="addButton"><span aria-hidden="true">＋</span> 숙제 추가</button>
          </div>
        </div>

        <div class="homework-list" id="homeworkList"></div>
      </section>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script th:src="@{/js/app.js}" defer></script>
</body>

</html>
